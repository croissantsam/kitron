<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Bench</title></head>
  <body>
    <main style="font-family: system-ui; padding: 32px">
      <h1>Hello Bench</h1>
      <p>ping → <span id="pong">…</span></p>
    </main>
    <script>
      // Self-driving renderer IPC bench: N sequential invokes. The harness
      // observes the forwarded frames on the host stdout; inter-arrival
      // times equal full round-trips (each invoke awaits the previous).
      window.addEventListener("load", async () => {
        for (let i = 0; i < 200 && !window.kitron; i++) {
          await new Promise((r) => setTimeout(r, 25));
        }
        if (!window.kitron) return;
        try {
          document.getElementById("pong").textContent = await window.kitron.invoke("ping");
        } catch { /* offline */ }
        const N = Number(new URLSearchParams(location.search).get("n") || "200");
        for (let i = 0; i < N; i++) {
          await window.kitron.invoke("ping");
        }
      });
    </script>
  </body>
</html>

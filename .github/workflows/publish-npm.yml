name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Bump version and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Toolchain (pnpm)
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Bump patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"

      - name: Publish to npm
        run: npm publish --access public

      - name: Generate release notes
        id: release_notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # No previous tag, get all commits
            COMMITS=$(git log --oneline --format="- %s (%h)" HEAD)
          else
            # Get commits since last tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --format="- %s (%h)")
          fi

          # Filter out merge commits, "Retry" commits, release commits, and version bumps for cleaner notes
          FILTERED_COMMITS=$(echo "$COMMITS" | grep -v "Merge branch" | grep -v "Retry" | grep -v "chore: release" | head -20)

          if [ -z "$FILTERED_COMMITS" ]; then
            RELEASE_BODY="Release notes for version ${{ steps.version.outputs.version }}.\n\nNo significant changes since last release."
          else
            RELEASE_BODY="Release notes for version ${{ steps.version.outputs.version }}.\n\n### Changes\n${FILTERED_COMMITS}"
          fi

          # Use heredoc to properly output multiline string to GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo -e "$RELEASE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          release_name: "Release v${{ steps.version.outputs.version }}"
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release commit and tag
        run: git push --follow-tags

name: release

# Automatic release flow: every push to `main` bumps the patch version, commits,
# tags and creates a GitHub Release. The `publish` workflow then publishes to
# npm automatically. Manual bumps (minor/major) can still be done locally with
# `npm version minor && git push --follow-tags`.
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 15
    # Skip the release commit itself and explicit skip requests.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip release]')"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Toolchain (pnpm)
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Toolchain (Rust)
        run: |
          rustup target add aarch64-apple-darwin

      - name: Typecheck
        run: pnpm run typecheck

      - name: Rust tests
        run: KITRON_NODE_PATH="$(command -v node)" cargo test --manifest-path runtime/rust/Cargo.toml

      - name: SDK smoke
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning tests/sdk-smoke.mjs

      - name: Bridge conformance
        run: node tests/bridge-conformance.mjs

      - name: Bump version
        run: |
          # Allow overriding the bump type via commit message keywords.
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qi "\[major\]"; then
            BUMP="major"
          elif echo "$MSG" | grep -qi "\[minor\]"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          echo "Bumping: $BUMP"
          npm version "$BUMP" -m "chore(release): %s"

      - name: Push commit and tag
        run: |
          git push origin HEAD
          git push origin --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0)
          gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

[package]
name = "kitron-windows-host"
version = "0.1.0"
edition = "2024"
description = "Kitron Windows host process: Win32 message pump + RNW attach point driving the kitron-windows C ABI."
publish = false

[dependencies]
kitron-windows = { path = "../kitron-windows" }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
serde_json = "1"

[[bin]]
name = "kitron-windows-host"
path = "src/main.rs"

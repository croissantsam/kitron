[package]
name = "kitron-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native macOS shell for the Kitron runtime: AppKit windows, menus, lifecycle"

[dependencies]
kitron-protocol.workspace = true
kitron-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dependencies.objc2]
workspace = true

[dependencies.block2]
workspace = true

[dependencies.objc2-app-kit]
workspace = true

[dependencies.objc2-user-notifications]
workspace = true

[dependencies.objc2-foundation]
workspace = true

[dependencies.objc2-uniform-type-identifiers]
workspace = true

[lib]
name = "kitron_macos"
crate-type = ["staticlib", "rlib"]

# The menu test drives AppKit, which is main-thread only: the test binary runs
# its own `main()` on the process' main thread instead of the default harness.
[[test]]
name = "menu"
harness = false

[package]
name = "kitron"
version = "0.1.0"
edition = "2021"
description = "Kitron native host binary: creates OS windows, hosts IPC, supervises Node sidecar."

[[bin]]
name = "kitron-runtime"
path = "src/main.rs"

[dependencies]
kitron-core = { path = "../kitron-core" }
kitron-runtime = { path = "../kitron-runtime" }
serde_json = { workspace = true }
tokio = { workspace = true }
winit = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

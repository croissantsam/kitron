[package]
name = "kitron-host"
version = "0.1.0"
edition = "2021"
description = "Kitron native host — windows, WebViews and OS APIs. Minimal Rust bridge (no business logic)."

[[bin]]
name = "kitron-host"
path = "src/main.rs"

[lib]
name = "kitron_host"
path = "src/lib.rs"

[features]
default = []
# Real native WebView (WKWebView / WebView2 / WebKitGTK via wry).
native-webview = ["dep:wry", "dep:winit"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "io-std", "process", "time"] }
wry = { version = "0.6", optional = true }
winit = { package = "tauri-winit", version = "0.24", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
core-graphics = "0.25"
core-foundation = "0.10"
